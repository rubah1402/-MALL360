<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MALL360 Mini Complex</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial}
canvas{display:block;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.top{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(#000b,transparent)}
.logo{margin-left:auto;font-weight:950}.logo b{color:#d8b65e}.pill{padding:8px 10px;border-radius:999px;background:#07111db8;border:1px solid #78ddff38;font-size:11px}
.loc{position:absolute;right:12px;top:72px;min-width:165px;padding:10px 12px;border-radius:16px;background:#07111db8;border:1px solid #78ddff38}.loc b{display:block;color:#e4c56c;font-size:12px}.loc small{color:#afc3cd;font-size:10px}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 12px;border-radius:999px;background:#07111db8;border:1px solid #ffffff20;font-size:10px;transition:.5s}
.enter{position:absolute;left:50%;bottom:145px;transform:translateX(-50%);display:none;pointer-events:auto}.enter button{border:0;border-radius:18px;padding:12px 20px;background:linear-gradient(135deg,#a97c28,#efd47c);font-weight:950}
.joy{position:absolute;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;border:1px solid #78ddff38;background:#07111d70;pointer-events:auto;touch-action:none}
.knob{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:#ffffffdd}.actions{position:absolute;right:14px;bottom:calc(22px + env(safe-area-inset-bottom));display:grid;gap:8px}
.actions button{pointer-events:auto;border:1px solid #78ddff38;background:#07111db8;color:#fff;border-radius:15px;padding:10px 13px;font-weight:800}
.loading{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#05070a}.gold{color:#d8b65e}.bar{width:220px;height:5px;background:#151b23;border-radius:99px;overflow:hidden;margin:14px auto}.bar i{display:block;height:100%;width:20%;background:#d8b65e;animation:l 1s infinite alternate}@keyframes l{to{width:100%}}
#toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);opacity:0;transition:.25s;padding:9px 12px;border-radius:12px;background:#07111df0;border:1px solid #78ddff38;font-size:10px}
@media(min-width:900px){.joy{display:none}}
</style></head>
<body>
<div class="loading" id="loading"><div><h1>MALL<span class="gold">360</span> MINI</h1><div class="bar"><i></i></div><small>جاري تجهيز المجمع الواقعي</small></div></div>
<div class="ui">
  <div class="top"><div class="logo">MALL<b>360</b> MINI</div><div class="pill">ويب • 3 متاجر</div></div>
  <div class="loc"><b id="locName">الساحة الرئيسية</b><small id="locSub">تحرك واقترب من أي متجر</small></div>
  <div class="hint" id="hint">اسحب للنظر • حرّك الجويستك للمشي</div>
  <div class="enter" id="enter"><button id="enterBtn">ادخل المتجر</button></div>
  <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
  <div class="actions"><button onclick="toggleRun()">🏃 <span id="runTxt">مشي</span></button><button onclick="resetPlayer()">↺ العودة للمدخل</button></div>
  <div id="toast"></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0e12);scene.fog=new THREE.FogExp2(0x0b0e12,.016);
const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,220);camera.position.set(0,1.72,13);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.body.insertBefore(renderer.domElement,document.body.firstChild);
const M=(c,m=.1,r=.45)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r});
const marble=M(0xbfc0bf,.08,.22),dark=M(0x15181d,.45,.24),wall=M(0xd7d2c9,0,.62),wood=M(0x6d4b2f,.05,.5);
const glass=new THREE.MeshPhysicalMaterial({color:0xa8d9ee,transparent:true,opacity:.18,roughness:.05,clearcoat:1,side:THREE.DoubleSide});
scene.add(new THREE.HemisphereLight(0xf3f7ff,0x2a2119,1.25));const dl=new THREE.DirectionalLight(0xffe4bd,3);dl.position.set(8,15,9);dl.castShadow=true;scene.add(dl);
function box(w,h,d,x,y,z,mat){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(34,40),marble);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
box(34,7,.45,0,3.5,-20,wall);box(.45,7,40,-17,3.5,0,wall);box(.45,7,40,17,3.5,0,wall);
for(let z=-18;z<=16;z+=6){box(33,.18,.18,0,7,z,dark);for(let x=-12;x<=12;x+=6){const l=new THREE.PointLight(0xffd2a1,18,8,2);l.position.set(x,5.7,z);scene.add(l)}}
box(5,.55,2.4,0,.27,2,wood);for(let i=-1;i<=1;i++){box(.22,1.8,.22,i*1.4,1.3,2,wood);const c=new THREE.Mesh(new THREE.SphereGeometry(.75,18,18),M(0x2f704b,0,.72));c.position.set(i*1.4,2.35,2);scene.add(c)}
function tex(title,sub){const c=document.createElement('canvas');c.width=1024;c.height=300;const g=c.getContext('2d');g.fillStyle='#0d1014';g.fillRect(0,0,1024,300);g.strokeStyle='#e3c56d';g.lineWidth=8;g.strokeRect(8,8,1008,284);g.fillStyle='#e3c56d';g.textAlign='center';g.font='bold 76px Arial';g.fillText(title,512,126);g.fillStyle='#fff';g.font='34px Arial';g.fillText(sub,512,202);return new THREE.CanvasTexture(c)}
const stores=[];
function addStore(name,sub,x,z,rot,type){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.BoxGeometry(8.4,5.8,.5),dark));const fr=new THREE.Mesh(new THREE.BoxGeometry(7.3,4.65,.08),glass);fr.position.z=.32;g.add(fr);const s=new THREE.Mesh(new THREE.PlaneGeometry(6.3,1.55),new THREE.MeshBasicMaterial({map:tex(name,sub)}));s.position.set(0,2.25,.36);g.add(s);const door=new THREE.Mesh(new THREE.BoxGeometry(2.7,3.5,.12),new THREE.MeshStandardMaterial({color:0x1b2c35,emissive:0x0d5b79,emissiveIntensity:.7,transparent:true,opacity:.65}));door.position.set(0,-.65,.38);g.add(door);
if(type==='g'){for(let r=0;r<3;r++)for(let i=-2;i<=2;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.65,.5,.45),M(new THREE.Color().setHSL((r*5+i+6)/20,.62,.52),.05,.42));p.position.set(i*.82,-1.5+r*.75,.82);g.add(p)}}
if(type==='c'){for(let i=-2;i<=2;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.62,.82,.18),M(new THREE.Color().setHSL((i+3)/8,.45,.52),0,.45));p.position.set(i*.95,.1,.9);g.add(p)}}
if(type==='e'){for(let i=-2;i<=2;i++){const t=new THREE.Mesh(new THREE.BoxGeometry(.95,.08,.75),wood);t.position.set(i*1.05,-1.25,.84);g.add(t);const d=new THREE.Mesh(new THREE.BoxGeometry(.18,.75,.42),M(0x111820,.65,.18));d.position.set(i*1.05,-.82,.84);g.add(d)}}
g.position.set(x,3,z);g.rotation.y=rot;scene.add(g);const p=new THREE.Object3D();const f=new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0),rot);p.position.set(x+f.x*4.2,1.2,z+f.z*4.2);p.userData={name};scene.add(p);stores.push(p)}
addStore('DAILY 360','بقالة',-10.5,-7,Math.PI/2,'g');addStore('LUXORA','ملابس',10.5,-7,-Math.PI/2,'c');addStore('TECH360','إلكترونيات',0,-16.4,0,'e');
const col=[{a:-2.8,b:2.8,c:.7,d:3.3},{a:-17,b:-6.2,c:-10.2,d:-3.8},{a:6.2,b:17,c:-10.2,d:-3.8},{a:-4.2,b:4.2,c:-20,d:-13.2}];function blocked(x,z){if(x<-15.7||x>15.7||z<-18.5||z>18.5)return true;return col.some(q=>x>q.a&&x<q.b&&z>q.c&&z<q.d)}
let yaw=0,pitch=0,mx=0,my=0,running=false,vel=new THREE.Vector3(),head=0,near=null;const clock=new THREE.Clock(),keys={};addEventListener('keydown',e=>keys[e.code]=1);addEventListener('keyup',e=>keys[e.code]=0);
let lid=null,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{lid=e.pointerId;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(lid)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lid)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw-=dx*.0036;pitch-=dy*.003;pitch=Math.max(-.58,Math.min(.58,pitch))});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lid)lid=null});
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jid=null,jr=null;function jm(e){const cx=jr.left+jr.width/2,cy=jr.top+jr.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=38,L=Math.hypot(dx,dy)||1;if(L>m){dx=dx/L*m;dy=dy/L*m}knob.style.transform=`translate(${dx}px,${dy}px)`;mx=dx/m;my=-dy/m}joy.addEventListener('pointerdown',e=>{jid=e.pointerId;jr=joy.getBoundingClientRect();joy.setPointerCapture(jid);jm(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});function je(e){if(e.pointerId===jid){jid=null;mx=my=0;knob.style.transform='translate(0,0)'}}joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
const enter=document.getElementById('enter'),enterBtn=document.getElementById('enterBtn');enterBtn.onclick=()=>near&&toast('الخطوة التالية: دخول '+near.userData.name+' من نفس العالم');
function anim(){requestAnimationFrame(anim);const dt=Math.min(clock.getDelta(),.033);let x=mx,y=my;if(keys.KeyW||keys.ArrowUp)y=1;if(keys.KeyS||keys.ArrowDown)y=-1;if(keys.KeyA||keys.ArrowLeft)x=-1;if(keys.KeyD||keys.ArrowRight)x=1;const len=Math.min(1,Math.hypot(x,y)),speed=(running?5.7:3.25)*len;const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),wish=new THREE.Vector3().addScaledVector(f,y).addScaledVector(r,x);if(wish.lengthSq())wish.normalize().multiplyScalar(speed);vel.lerp(wish,Math.min(1,(len?8.5:11.5)*dt));const nx=camera.position.x+vel.x*dt,nz=camera.position.z+vel.z*dt;if(!blocked(nx,camera.position.z))camera.position.x=nx;else vel.x*=.1;if(!blocked(camera.position.x,nz))camera.position.z=nz;else vel.z*=.1;const sp=vel.length();if(sp>.15){head+=dt*(running?10:7.2);camera.position.y=1.72+Math.sin(head)*.025}else camera.position.y+=(1.72-camera.position.y)*Math.min(1,8*dt);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;let best=999;near=null;for(const p of stores){const d=camera.position.distanceTo(p.position);if(d<best){best=d;near=p}}if(best<4.8){enter.style.display='block';enterBtn.textContent='ادخل '+near.userData.name;locName.textContent=near.userData.name;locSub.textContent='أنت أمام بوابة المتجر'}else{enter.style.display='none';locName.textContent='الساحة الرئيسية';locSub.textContent='تحرك واقترب من أي متجر'}renderer.render(scene,camera)}anim();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>{loading.style.display='none';setTimeout(()=>hint.style.opacity='0',3200)},1200);window.toggleRun=()=>{running=!running;runTxt.textContent=running?'ركض':'مشي'};window.resetPlayer=()=>{camera.position.set(0,1.72,13);vel.set(0,0,0);yaw=pitch=0};window.toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.style.opacity='1';setTimeout(()=>e.style.opacity='0',1800)};
</script></body></html>
