<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitting World</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Tahoma,sans-serif;background:#07111f;color:white}
body{direction:rtl}
.wrap{min-height:100vh;padding:18px;background:linear-gradient(180deg,#07111f,#0b1830)}
.hero{max-width:900px;margin:auto;padding:20px;border-radius:24px;background:rgba(13,31,55,.92);border:1px solid rgba(125,225,255,.25)}
h1{margin:0 0 10px;font-size:32px}.sub{color:#cfe8f1;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
a.card{display:flex;min-height:110px;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:#fff;font-weight:700;border-radius:20px;border:1px solid rgba(125,225,255,.35);background:linear-gradient(180deg,#12345a,#0a1d36);padding:16px}
a.card:active{transform:scale(.98)}
.back{display:inline-block;margin-top:18px;color:#9cecff;text-decoration:none}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}h1{font-size:28px}a.card{min-height:95px}}
</style></head><body><div class="wrap"><main class="hero"><h1>Fitting World</h1><div class="sub">غرفة قياس افتراضية ومقارنة إطلالات.</div><div class="grid"><a class="card" href="fashion.html">Fashion District</a><a class="card" href="stores.html">Store Worlds</a></div><a class="back" href="index.html">← الرئيسية</a></main></div></body></html>
