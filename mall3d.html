<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MALL360 — 3D Walk</title>
<style>
:root{--gold:#e7c56d;--cyan:#54e6ff;--glass:rgba(5,12,22,.68);--line:rgba(120,225,255,.22)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:20}
.top{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(180deg,rgba(2,6,12,.90),rgba(2,6,12,.05))}
.logo{margin-left:auto;font-size:20px;font-weight:950;letter-spacing:.5px}.logo b{color:var(--gold)}
.pill,.round{pointer-events:auto;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);color:#fff}
.pill{padding:8px 11px;border-radius:999px;font-size:11px}.pill strong{color:var(--gold)}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;text-decoration:none}
#place{position:absolute;top:calc(67px + env(safe-area-inset-top));right:12px;min-width:165px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px)}
#place b{display:block;color:var(--gold);font-size:12px}#place small{color:#a9c0ca;font-size:10px}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 12px;border-radius:999px;background:rgba(4,10,18,.68);border:1px solid rgba(255,255,255,.12);font-size:10px;transition:.5s}
#enter{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);display:none;pointer-events:auto}
#enter button{border:none;border-radius:18px;padding:12px 20px;font-weight:950;background:linear-gradient(135deg,#b8872d,#f0d47c);color:#15110a;box-shadow:0 14px 36px #0008}
#joy{position:absolute;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;border:1px solid var(--line);background:rgba(4,10,18,.42);backdrop-filter:blur(10px);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.86);box-shadow:0 8px 20px #0009}
.actions{position:absolute;right:14px;bottom:calc(22px + env(safe-area-inset-bottom));display:grid;gap:8px}
.actions button{pointer-events:auto;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);color:#fff;border-radius:15px;padding:10px 13px;font-weight:850}
.actions .primary{background:linear-gradient(135deg,#0eb5d8,#715fff)}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff9}
#cross:before{width:18px;height:1px;top:8px}#cross:after{height:18px;width:1px;left:8px}
#loading{position:fixed;z-index:99;inset:0;background:#02050a;display:grid;place-items:center}
.load{text-align:center}.load h1{margin:0;font-size:38px}.load h1 b{color:var(--gold)}.bar{width:210px;height:5px;background:#151b23;border-radius:99px;overflow:hidden;margin:14px auto}.bar i{display:block;height:100%;width:18%;background:var(--gold);animation:ld 1.1s infinite alternate}@keyframes ld{to{width:100%}}
#toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);padding:9px 12px;border-radius:13px;border:1px solid var(--line);background:rgba(4,10,18,.88);font-size:10px;opacity:0;transition:.25s}
#map{position:absolute;left:12px;top:calc(67px + env(safe-area-inset-top));width:112px;height:112px;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle,rgba(84,230,255,.12) 0 2px,transparent 3px),repeating-radial-gradient(circle,rgba(84,230,255,.10) 0 1px,transparent 2px 26px),rgba(4,10,18,.55);backdrop-filter:blur(10px)}
#map:after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;border-radius:50%;background:var(--cyan);transform:translate(-50%,-50%);box-shadow:0 0 18px var(--cyan)}
@media(min-width:900px){#joy{display:none}}
</style>
</head>
<body>
<div id="loading"><div class="load"><h1>MALL<b>360</b></h1><div class="bar"><i></i></div><small>جاري بناء العالم ثلاثي الأبعاد</small></div></div>
<div id="ui">
  <div class="top">
    <div class="logo">MALL<b>360</b></div>
    <div class="pill">الرصيد <strong>10,000 M360</strong></div>
    <button class="round" onclick="voice()">🎤</button>
    <button class="round" onclick="toast('الأصدقاء: 3 داخل المول الآن')">👥</button>
    <button class="round" onclick="toast('السلة فارغة')">🛒</button>
  </div>
  <div id="map"></div>
  <div id="place"><b id="placeName">الساحة الرئيسية</b><small id="placeSub">تحرك واقترب من واجهات المتاجر</small></div>
  <div id="hint">اسحب الشاشة للنظر حولك • استخدم دائرة الحركة للمشي</div>
  <div id="cross"></div>
  <div id="enter"><button id="enterBtn">ادخل المتجر</button></div>
  <div id="joy"><div id="knob"></div></div>
  <div class="actions">
    <button class="primary" onclick="runToggle()">🏃 <span id="runTxt">مشي</span></button>
    <button onclick="resetPos()">↺ العودة للساحة</button>
    <button onclick="toast('MALL AI: قل لي وين تبي تروح؟')">✦ MALL AI</button>
  </div>
  <div id="toast"></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070a10);
scene.fog=new THREE.FogExp2(0x0b0e14,0.009);

const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,500);
camera.position.set(0,1.72,23);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement,document.body.firstChild);

// ---------- MATERIALS ----------
const matMarble=new THREE.MeshStandardMaterial({color:0x26292e,metalness:.35,roughness:.18});
const matGold=new THREE.MeshStandardMaterial({color:0xc39a45,metalness:.8,roughness:.22,emissive:0x2b1903,emissiveIntensity:.35});
const matDark=new THREE.MeshStandardMaterial({color:0x11151b,metalness:.45,roughness:.22});
const matGlass=new THREE.MeshPhysicalMaterial({color:0x9ed7ef,transparent:true,opacity:.19,roughness:.05,metalness:.05,clearcoat:1,side:THREE.DoubleSide});
const matBlue=new THREE.MeshStandardMaterial({color:0x1c8bb8,emissive:0x0a5f8f,emissiveIntensity:1.4,metalness:.28,roughness:.2});

// ---------- LIGHT ----------
scene.add(new THREE.HemisphereLight(0xd6edff,0x120d08,1.65));
const key=new THREE.DirectionalLight(0xffe3ba,3.1); key.position.set(10,22,12); key.castShadow=true; scene.add(key);
for(let z=-38; z<=30; z+=9){let l=new THREE.PointLight(0xffc66e,55,17,2);l.position.set(0,5,z);scene.add(l)}
for(let z=-34; z<=26; z+=12){let l=new THREE.PointLight(0x46cfff,45,14,2);l.position.set(-8,3.2,z);scene.add(l); let r=l.clone();r.position.x=8;scene.add(r)}

// ---------- FLOOR / ATRIUM ----------
const floor=new THREE.Mesh(new THREE.PlaneGeometry(36,90),matMarble);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
for(let x of [-9,9]){let strip=new THREE.Mesh(new THREE.BoxGeometry(.06,.02,86),matGold);strip.position.set(x,.02,-3);scene.add(strip)}
for(let z=-40;z<35;z+=7){let strip=new THREE.Mesh(new THREE.BoxGeometry(32,.02,.045),matGold);strip.position.set(0,.025,z);scene.add(strip)}

// Curved balcony suggestion
for(let y of [4.5,8.5]){
  const geo=new THREE.TorusGeometry(16,.22,12,96,Math.PI);
  const a=new THREE.Mesh(geo,matGold);a.rotation.x=Math.PI/2;a.rotation.z=Math.PI;a.position.set(0,y,-6);scene.add(a);
  const b=a.clone();b.rotation.z=0;scene.add(b);
}

// glass roof ribs
for(let i=0;i<18;i++){
  const beam=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,32),matGold);
  beam.position.set(0,11,-6);beam.rotation.y=(i/18)*Math.PI;scene.add(beam)
}
const roof=new THREE.Mesh(new THREE.CylinderGeometry(16,16,.12,64,1,true),matGlass);roof.rotation.z=Math.PI/2;roof.position.set(0,11,-6);scene.add(roof);

// ---------- CENTER GLOBE / FOUNTAIN ----------
const center=new THREE.Group();
const basin=new THREE.Mesh(new THREE.CylinderGeometry(5.5,5.8,.55,64),matDark);basin.position.y=.28;center.add(basin);
const water=new THREE.Mesh(new THREE.CylinderGeometry(5.05,5.05,.14,64),new THREE.MeshPhysicalMaterial({color:0x157da5,transparent:true,opacity:.72,roughness:.04,clearcoat:1}));water.position.y=.58;center.add(water);
const globe=new THREE.Mesh(new THREE.SphereGeometry(1.9,48,48),matBlue);globe.position.y=3.05;center.add(globe);
const ring1=new THREE.Mesh(new THREE.TorusGeometry(2.5,.055,14,96),new THREE.MeshStandardMaterial({color:0x5be8ff,emissive:0x2ad7ff,emissiveIntensity:2}));
ring1.position.y=3.05;ring1.rotation.x=Math.PI/2;center.add(ring1);
const ring2=ring1.clone();ring2.rotation.y=Math.PI/2;center.add(ring2);
center.position.z=6;scene.add(center);

// ---------- SIGNS ----------
function signTexture(title,sub,accent='#f2d27b'){
  const c=document.createElement('canvas');c.width=1024;c.height=320;const x=c.getContext('2d');
  x.fillStyle='#080b10';x.fillRect(0,0,c.width,c.height);
  x.strokeStyle='#2ad7ff';x.lineWidth=8;x.strokeRect(8,8,c.width-16,c.height-16);
  x.fillStyle=accent;x.textAlign='center';x.font='bold 78px Arial';x.fillText(title,512,132);
  x.fillStyle='#fff';x.font='36px Arial';x.fillText(sub,512,205);
  return new THREE.CanvasTexture(c);
}
function addSign(title,sub,x,y,z,rotY=0){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(5.6,1.8),new THREE.MeshBasicMaterial({map:signTexture(title,sub),transparent:false}));
  m.position.set(x,y,z);m.rotation.y=rotY;scene.add(m);return m;
}

// ---------- STORES / PORTALS ----------
const portals=[];
function store(name,sub,x,z,side,url,accent=0xf2d27b){
  const g=new THREE.Group();
  const frame=new THREE.Mesh(new THREE.BoxGeometry(7.8,6,.65),matDark);frame.castShadow=true;g.add(frame);
  const glass=new THREE.Mesh(new THREE.BoxGeometry(6.7,4.65,.10),matGlass);glass.position.z=.37;g.add(glass);
  const sign=new THREE.Mesh(new THREE.PlaneGeometry(6.1,1.55),new THREE.MeshBasicMaterial({map:signTexture(name,sub,`#${accent.toString(16).padStart(6,'0')}`)}));
  sign.position.set(0,2.35,.39);g.add(sign);
  // entrance opening / neon threshold
  const door=new THREE.Mesh(new THREE.BoxGeometry(3.15,3.9,.08),new THREE.MeshStandardMaterial({color:0x112639,emissive:0x0e87b4,emissiveIntensity:1.4,transparent:true,opacity:.75}));
  door.position.set(0,-.45,.42);g.add(door);
  // products
  for(let i=-2;i<=2;i++){
    const p=new THREE.Mesh(new THREE.BoxGeometry(.75,.95,.75),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL((i+3)/7,.52,.5),metalness:.25,roughness:.3}));
    p.position.set(i*1.12,-1.65,.75);g.add(p);
  }
  g.position.set(x,3,z);
  g.rotation.y=side==='L'?Math.PI/2:-Math.PI/2;
  scene.add(g);
  const portal=new THREE.Object3D();
  portal.position.set(x+(side==='L'?3.9:-3.9),1.2,z);
  portal.userData={name,url};scene.add(portal);portals.push(portal);
}
store('LUXORA','FASHION',-14.5,15,'L','store-luxora.html');
store('TECH360','FUTURE TECH',14.5,15,'R','store-tech.html',0x67e7ff);
store('BEAUTY HUB','BEAUTY & FRAGRANCE',-14.5,2,'L','store-generic.html?name=BEAUTY%20HUB');
store('HOME360','HOME & DESIGN',14.5,2,'R','store-generic.html?name=HOME360');
store('SPORT LAB','SPORT & LIFESTYLE',-14.5,-11,'L','store-generic.html?name=SPORT%20LAB',0x67e7ff);
store('SKY GRILL','RESTAURANT',14.5,-11,'R','restaurant.html?name=SKY%20GRILL');
store('COFFEE HOUSE','SPECIALTY COFFEE',-14.5,-24,'L','restaurant.html?name=COFFEE%20HOUSE');
store('NOMAD','FINE DINING',14.5,-24,'R','restaurant.html?name=NOMAD');
store('MAJLIS 360','SOCIAL LOUNGE',-14.5,-37,'L','majlis.html');
store('BALOOT ARENA','PLAY & CONNECT',14.5,-37,'R','baloot.html');

// ---------- DECOR ----------
function palm(x,z){
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.25,3.4,12),new THREE.MeshStandardMaterial({color:0x724d2e}));
  trunk.position.set(x,1.7,z);scene.add(trunk);
  for(let i=0;i<9;i++){
    const leaf=new THREE.Mesh(new THREE.ConeGeometry(.20,2.25,7),new THREE.MeshStandardMaterial({color:0x1f704c}));
    leaf.position.set(x,3.6,z);leaf.rotation.z=Math.PI/2.15;leaf.rotation.y=i/9*Math.PI*2;scene.add(leaf);
  }
}
for(let z of [21,9,-3,-15,-27,-39]){palm(-6.5,z);palm(6.5,z)}

function npc(x,z,color=0xf2f2f2){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.CapsuleGeometry(.30,.95,6,12),new THREE.MeshStandardMaterial({color}));b.position.y=1;g.add(b);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.23,18,18),new THREE.MeshStandardMaterial({color:0xc79b77}));h.position.y=1.95;g.add(h);
  g.position.set(x,0,z);scene.add(g)
}
npc(-3,17);npc(4,12,0x111111);npc(-4,4,0x0c5f39);npc(3,-7,0xeaeaea);npc(-3,-17,0x171717);npc(4,-29,0xeaeaea);

// ---------- CONTROLS ----------
let yaw=0,pitch=0,running=false,moveX=0,moveY=0,nearby=null;
const clock=new THREE.Clock();
const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);

let lookId=null,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.004;pitch-=dy*.003;pitch=Math.max(-.60,Math.min(.60,pitch))});
renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});

const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jid=null,jrect=null;
function joySet(e){
  const cx=jrect.left+jrect.width/2,cy=jrect.top+jrect.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=38,l=Math.hypot(dx,dy)||1;
  if(l>m){dx=dx/l*m;dy=dy/l*m} knob.style.transform=`translate(${dx}px,${dy}px)`;moveX=dx/m;moveY=-dy/m;
}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;jrect=joy.getBoundingClientRect();joy.setPointerCapture(jid);joySet(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joySet(e)});
function joyEnd(e){if(e.pointerId===jid){jid=null;moveX=moveY=0;knob.style.transform='translate(0,0)'}}
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);

const enter=document.getElementById('enter'),enterBtn=document.getElementById('enterBtn');
enterBtn.onclick=()=>{if(nearby) location.href=nearby.userData.url};

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.033);
  let mx=moveX,my=moveY;
  if(keys.KeyW||keys.ArrowUp)my=1;if(keys.KeyS||keys.ArrowDown)my=-1;if(keys.KeyA||keys.ArrowLeft)mx=-1;if(keys.KeyD||keys.ArrowRight)mx=1;
  const sp=(running?7.6:4.1)*dt;
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  camera.position.addScaledVector(forward,my*sp);
  camera.position.addScaledVector(right,mx*sp);
  camera.position.x=Math.max(-11.3,Math.min(11.3,camera.position.x));
  camera.position.z=Math.max(-42,Math.min(29,camera.position.z));
  camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;

  let best=999;nearby=null;
  for(const p of portals){const d=camera.position.distanceTo(p.position);if(d<best){best=d;nearby=p}}
  if(best<4.4){
    enter.style.display='block';enterBtn.textContent='ادخل '+nearby.userData.name;
    document.getElementById('placeName').textContent=nearby.userData.name;
    document.getElementById('placeSub').textContent='أنت أمام بوابة المكان';
  }else{
    enter.style.display='none';
    document.getElementById('placeName').textContent='الساحة الرئيسية';
    document.getElementById('placeSub').textContent='تحرك واقترب من واجهات المتاجر';
  }

  globe.rotation.y+=dt*.18; ring1.rotation.z+=dt*.20; ring2.rotation.x+=dt*.16;
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setTimeout(()=>{document.getElementById('loading').style.display='none';setTimeout(()=>document.getElementById('hint').style.opacity='0',3600)},1300);

window.runToggle=()=>{running=!running;document.getElementById('runTxt').textContent=running?'ركض':'مشي'};
window.resetPos=()=>{camera.position.set(0,1.72,23);yaw=pitch=0};
window.toast=t=>{const x=document.getElementById('toast');x.textContent=t;x.style.opacity='1';setTimeout(()=>x.style.opacity='0',1800)};
window.voice=()=>toast('الصوت المباشر يربط لاحقًا بخدمة Realtime');
</script>
</body>
</html>
